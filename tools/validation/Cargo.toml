[package]
name = "xyzdb-validate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Iván Moreno Mendoza <ivan@tuno.bar>"]
license = "BUSL-1.1"
publish = false

[dependencies]
xyzdb-core = { path = "../../crates/core" }
tokio = { version = "1", features = ["full"] }
rand = "0.10"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
bincode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
