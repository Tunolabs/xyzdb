[package]
name = "xyzdb-server"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
xyzdb-core = { path = "../core" }
xytalk-parser = { path = "../xytalk-parser" }
xyzdb-engine = { path = "../engine" }
tokio.workspace = true
bincode.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
libc = "0.2"
# v0.4 item 3: optional TLS 1.3 server-side via --tls-cert/--tls-key.
# tokio-rustls 0.26 pairs with tokio 1.x + rustls 0.23.
tokio-rustls = "0.26"
rustls-pemfile = "2"

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["background_threads", "unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
tempfile.workspace = true
# tokio-rustls / rustls-pemfile already present as runtime deps (TLS server);
# the TLS E2E test uses them on the client side too.
# v0.4 cp 2.2.4: validate that /metrics output is parseable by an
# official Prometheus parser (cycle plan rule: don't invent the format).
prometheus-parse = "0.2"

[lints]
workspace = true
