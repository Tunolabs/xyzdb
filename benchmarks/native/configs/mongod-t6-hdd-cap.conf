# MongoDB 7.0 — T6 HDD-cap profile (2 CPU / 8 GB cgroup, spinning disk).
# C-13: working-set ≫ cache regime forced — cacheSizeGB reduced from
# 3.0 to 0.5 so WiredTiger cache cannot cover the scale 1.0 working set
# (~14GB Mongo doc footprint + ~5GB indexes). Counterpart of
# postgresql-t6-hdd-cap.conf and CACHE_SIZE=512 for xyzDB.

storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

systemLog:
  destination: file
  path: /data/db/mongod.log
  logAppend: true
  verbosity: 0

net:
  bindIp: 0.0.0.0
  port: 27017
  maxIncomingConnections: 200

operationProfiling:
  mode: off
