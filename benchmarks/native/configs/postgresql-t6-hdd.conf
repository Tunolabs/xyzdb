# PostgreSQL 18 — T6 HDD profile (2 CPU / 8 GB cgroup, spinning disk)
# v0.2.5 native bench.

# Memory
shared_buffers              = 2GB
effective_cache_size        = 6GB
work_mem                    = 64MB
maintenance_work_mem        = 512MB

# Parallelism (T6 = 2 CPU)
max_parallel_workers_per_gather = 1
max_worker_processes        = 4

# Planner — HDD profile (spinning disk)
random_page_cost            = 4.0
effective_io_concurrency    = 2
default_statistics_target   = 200

# WAL — HDD-tuned: smaller fsync windows hurt; let WAL grow.
wal_buffers                 = 64MB
max_wal_size                = 4GB
checkpoint_completion_target = 0.9
synchronous_commit          = on
wal_compression             = on

# Connections
max_connections             = 60
listen_addresses            = '*'
port                        = 5432
jit                         = off

# Logging
log_min_duration_statement  = 1000
log_checkpoints             = on
log_lock_waits              = on
