# MongoDB 8.0 — T6 (2 CPU / 8 GB) bench config.
# Mirrors PostgreSQL T6 cgroup so Bench A is tuned-vs-tuned.
#
# Cache 3.0 GB ≈ 37.5 % of 8 GB cgroup, parallel to PG's
# `shared_buffers = 25 %` adjusted for WiredTiger's separate cache
# management. Snappy compression is the WiredTiger default; kept
# explicit for reproducibility.

storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 3.0
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

systemLog:
  destination: file
  path: /data/db/mongod.log
  logAppend: true
  verbosity: 0

net:
  bindIp: 0.0.0.0
  port: 27017
  maxIncomingConnections: 200

operationProfiling:
  mode: off

# Journaling is on by default in 8.0; { w: 1, j: true } write concern is
# applied per-operation by the driver to match PG `synchronous_commit=on`
# and xyzDB `--durability durable`.
