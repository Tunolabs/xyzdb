# PostgreSQL 18 — T6 SSD profile (2 CPU / 8 GB cgroup)
# v0.2.5 native bench.

# Memory
shared_buffers              = 2GB
effective_cache_size        = 6GB
work_mem                    = 64MB
maintenance_work_mem        = 512MB

# Parallelism (T6 = 2 CPU)
max_parallel_workers_per_gather = 1
max_worker_processes        = 4

# Planner — SSD profile
random_page_cost            = 1.1
effective_io_concurrency    = 200
default_statistics_target   = 200

# WAL
wal_buffers                 = 64MB
max_wal_size                = 2GB
checkpoint_completion_target = 0.9
synchronous_commit          = on

# Connections
max_connections             = 60
listen_addresses            = '*'
port                        = 5432
jit                         = off

# Logging
log_min_duration_statement  = 1000
log_checkpoints             = on
log_lock_waits              = on
