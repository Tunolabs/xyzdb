# PostgreSQL 18 — T6 HDD-cap profile (2 CPU / 8 GB cgroup, spinning disk).
# C-13: working-set ≫ cache regime forced — shared_buffers reduced from
# 2GB to 256MB so kernel page cache + PG cache combined cannot cover the
# scale 1.0 working set (~50GB). Without this cap, HDD numbers approach
# SSD numbers in benches because page cache absorbs the disk layer.
# Counterpart of mongod-t6-hdd-cap.conf and CACHE_SIZE=512 for xyzDB.

# Memory
shared_buffers              = 256MB
effective_cache_size        = 2GB
work_mem                    = 64MB
maintenance_work_mem        = 512MB

# Parallelism (T6 = 2 CPU)
max_parallel_workers_per_gather = 1
max_worker_processes        = 4

# Planner — HDD profile (spinning disk)
random_page_cost            = 4.0
effective_io_concurrency    = 2
default_statistics_target   = 200

# WAL — HDD-tuned: smaller fsync windows hurt; let WAL grow.
wal_buffers                 = 64MB
max_wal_size                = 4GB
checkpoint_completion_target = 0.9
synchronous_commit          = on
wal_compression             = on

# Connections
max_connections             = 60
listen_addresses            = '*'
port                        = 5432
jit                         = off

# Logging
log_min_duration_statement  = 1000
log_checkpoints             = on
log_lock_waits              = on
