[workspace]
resolver = "2"
members = [
    "generator",
    "drivers/xyzdb",
    "drivers/postgres",
    "drivers/mongo",
    "orchestrator",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Iván Moreno Mendoza <ivan@tuno.bar>"]
license = "BUSL-1.1"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
rand_chacha = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
mongodb = "3"
bytes = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
csv = "1.3"
sha2 = "0.10"
hex = "0.4"

# Local crates
native-generator = { path = "generator" }
native-driver-xyzdb = { path = "drivers/xyzdb" }
native-driver-postgres = { path = "drivers/postgres" }
native-driver-mongo = { path = "drivers/mongo" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
